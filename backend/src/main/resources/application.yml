# Cấu hình chung. Giá trị theo môi trường lấy từ biến môi trường (I11):
#   set -a; source "$(infra/werwa.sh env)"; set +a
spring:
  application:
    name: werwa-backend
  flyway:
    # Lịch sử Flyway nằm ở schema platform (Q1). Bảy schema tạo trong V1.
    default-schema: platform
    schemas: platform
    locations: classpath:db/migration
  modulith:
    events:
      # Sổ sự kiện làm outbox (D4): bảng do Flyway tạo ở schema platform (Q1, V3)
      jdbc:
        schema: platform
        schema-initialization:
          enabled: false
      completion-mode: archive
      republish-outstanding-events-on-restart: true
  jackson:
    time-zone: UTC
    # Trường không có giá trị thì bỏ, không ghi null: lược đồ OpenAPI 3.1 không cho null ở trường tùy chọn.
    default-property-inclusion: non_null
  servlet:
    multipart:
      # Tài liệu hồ sơ phát hành (US-2.04): tệp PDF lớn
      max-file-size: 50MB
      max-request-size: 51MB
  threads:
    virtual:
      enabled: true

server:
  port: ${WERWA_HTTP_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health, info, modulith
