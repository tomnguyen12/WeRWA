# Cấu hình cho kiểm thử tích hợp (*IT). DataSource do Testcontainers cấp (@ServiceConnection).
werwa:
  api:
    probe-contract: classpath:probe/openapi-probe.yaml
  distribution:
    book-scheduler-enabled: false
  onboarding:
    # Tổ chức thử của devnet (I6), đã qua KYB, để token thử khớp org_id.
    seed-organizations: classpath:seed/orgs.json
  governance:
    alert-token: test-alert-token
    notification-mail-enabled: false
    reconciliation-enabled: false
    supervision-monitor-enabled: false
    # Neo nhật ký cần chuỗi: kiểm thử neo gọi thẳng dịch vụ (AuditAnchorIT).
    anchor-enabled: false
  onchain:
    # Kiểm thử không có chuỗi: tắt indexer và việc định kỳ; ChainIntegrationTest bật lại.
    workers-enabled: false
  nats:
    url: nats://127.0.0.1:4222
    stream: WERWA
  oidc:
    client-id: werwa-web
  chain:
    id: 1337
    read-urls: http://127.0.0.1:8555
    submit-urls: http://127.0.0.1:8545
    deployed-at-block: 0
    signing-mode: devnet
spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          # Kiểm thử dùng jwt() của spring-security-test, không gọi tới Keycloak; địa chỉ chỉ để tạo JwtDecoder.
          jwk-set-uri: http://127.0.0.1:1/realms/werwa/protocol/openid-connect/certs
