    ReconciliationRun:
      type: object
      required:
      - id
      - runDate
      - scope
      - breakCount
      properties:
        id:
          type: string
          format: uuid
          description: UUIDv7
        runDate:
          type: string
          format: date
        scope:
          type: string
          enum:
          - CHAIN_VS_VIEW
          - CHAIN_VS_BANK
          - BLOCK_HASH_VSDC
        breakCount:
          type: integer
        breaks:
          type: array
          items:
            type: object
            required:
            - kind
            - subjectRef
            properties:
              kind:
                type: string
              subjectRef:
                type: string
              expected:
                type: string
              actual:
                type: string
              resolvedBy:
                type: string
                format: uuid
                description: UUIDv7
            additionalProperties: false
      additionalProperties: false
    BidvCreditNotification:
      type: object
      required:
      - bankRef
      - virtualAccount
      - amount
      - valueDate
      - payerName
      properties:
        bankRef:
          type: string
        virtualAccount:
          type: string
        amount:
          $ref: '#/components/schemas/Money'
        valueDate:
          type: string
          format: date
        payerName:
          type: string
        remittanceInfo:
          type: string
      additionalProperties: false
    BidvPayoutConfirmation:
      type: object
      required:
