openapi: 3.1.0
info:
  title: WeRWA API
  version: 0.3.0
  description: 'Bản đầu sinh từ docs/design/05-api-va-su-kien.md (duyệt 19/10/2026). Đây là hợp đồng giữa backend và frontend: đổi ở đây trước,
    qua PR có SA duyệt, rồi mới sửa code. Thao tác dẫn tới ký trên chuỗi trả 202 kèm mã đề nghị ký.'
servers:
- url: https://api.werwa.local
  description: Giữ chỗ; địa chỉ thật theo môi trường
security:
- oidc: []
tags:
- name: onboarding
  description: '1 · Onboarding: tổ chức, KYC, ví'
- name: issuance
  description: '2 · Phát hành: Đề án, series'
- name: distribution
  description: '3 · Quản lý phân phối: sổ lệnh, phân bổ, ghi sổ, chuyển nhượng'
- name: governance
  description: '4 · Quản trị: duyệt, ký, phong tỏa, giám sát'
- name: integration
  description: '5 · Tích hợp: bên ngoài gọi vào'
paths:
  /v1/organizations:
    post:
      tags:
      - onboarding
      operationId: createOrganization
      summary: Tạo tổ chức, vai, hồ sơ KYB
      x-werwa-function: '1.01'
      x-werwa-callers: Holco
      x-werwa-roles:
      - OPERATOR
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationCreate'
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        4XX:
          description: Lỗi
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        5XX:
          description: Lỗi
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/organizations/{id}:
    get:
      tags:
      - onboarding
      operationId: getOrganization
      summary: Xem tổ chức
      x-werwa-function: '1.01'
      x-werwa-callers: Mọi bên có quyền
      x-werwa-roles:
      - ANY
      parameters:
      - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        4XX:
          description: Lỗi
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        5XX:
          description: Lỗi
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/organizations/{id}/kyb-decision:
    post:
      tags:
      - onboarding
      operationId: decideKyb
      summary: Duyệt hoặc từ chối KYB
      x-werwa-function: '1.01'
      x-werwa-callers: Holco · người duyệt
      x-werwa-roles:
      - OPERATOR
      parameters:
      - $ref: '#/components/parameters/Id'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Decision'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        4XX:
          description: Lỗi
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        5XX:
          description: Lỗi
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/organizations/{id}/signers:
    post:
      tags:
      - onboarding
      operationId: addSigner
      summary: Đăng ký người ký được ủy quyền và địa chỉ ký
      x-werwa-function: '1.01'
      x-werwa-callers: Holco
      x-werwa-roles:
      - OPERATOR
      parameters:
      - $ref: '#/components/parameters/Id'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignerCreate'
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizedSigner'
        4XX:
          description: Lỗi
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        5XX:
          description: Lỗi
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/kyc-cases:
    post:
      tags:
      - onboarding
      operationId: openKycCase
      summary: Mở hồ sơ KYC nhà đầu tư, gọi sàng lọc cấm vận
      x-werwa-function: '1.02'
      x-werwa-callers: Tổ hợp, Holco
      x-werwa-roles:
      - SYNDICATE
      - OPERATOR
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KycCaseCreate'
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KycCase'
        4XX:
          description: Lỗi
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        5XX:
          description: Lỗi
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/kyc-cases/{id}/decision:
    post:
      tags:
      - onboarding
      operationId: decideKyc
      summary: Kết luận KYC; được duyệt thì phát claim
      x-werwa-function: 1.02 · 1.03
      x-werwa-callers: Holco · người duyệt
      x-werwa-roles:
      - OPERATOR
      parameters:
      - $ref: '#/components/parameters/Id'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KycDecision'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KycCase'
        4XX:
          description: Lỗi
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        5XX:
          description: Lỗi
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/wallet-challenges:
    post:
      tags:
      - onboarding
      operationId: createWalletChallenge
      summary: Lấy thông điệp thử thách để chứng minh chủ ví (ngầm định từ US-1.04 AC1)
      x-werwa-function: '1.04'
      x-werwa-callers: Nhà đầu tư, lưu ký
      x-werwa-roles:
      - INVESTOR
      - CUSTODIAN
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - address
              properties:
                address:
                  type: string
                  pattern: ^0x[0-9a-fA-F]{40}$
              additionalProperties: false
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletChallenge'
        4XX:
          description: Lỗi
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        5XX:
          description: Lỗi
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/wallets:
    post:
      tags:
      - onboarding
      operationId: registerWallet
      summary: Đăng ký ví; kiểm chủ ví bằng chữ ký rồi ghi sổ định danh
      x-werwa-function: '1.04'
      x-werwa-callers: Nhà đầu tư, lưu ký
      x-werwa-roles:
      - INVESTOR
      - CUSTODIAN
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WalletRegister'
      responses:
        '202':
          description: Đã nhận; ghi sổ định danh trên chuỗi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Wallet'
        4XX:
          description: Lỗi
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        5XX:
          description: Lỗi
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/programs:
    post:
      tags:
      - issuance
      operationId: createProgram
      summary: Nhập Đề án đã duyệt và các khung
      x-werwa-function: '2.01'
      x-werwa-callers: Cơ quan điều hành
      x-werwa-roles:
      - OPERATING_AGENCY
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProgramCreate'
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Program'
        4XX:
          description: Lỗi
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        5XX:
          description: Lỗi
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/programs/{id}:
    get:
      tags:
      - issuance
      operationId: getProgram
      summary: Xem Đề án
      x-werwa-function: '2.01'
      x-werwa-callers: Mọi bên có quyền
      x-werwa-roles:
      - ANY
      parameters:
      - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Program'
        4XX:
          description: Lỗi
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        5XX:
          description: Lỗi
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/programs/{id}/limits:
    get:
      tags:
      - issuance
      operationId: getProgramLimits
      summary: Hạn mức đã dùng và còn lại
      x-werwa-function: '2.02'
      x-werwa-callers: UBND, CQĐH, Sở TC
      x-werwa-roles:
      - ISSUER
      - OPERATING_AGENCY
      parameters:
      - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProgramLimits'
        4XX:
          description: Lỗi
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        5XX:
          description: Lỗi
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/documents:
    post:
      tags:
      - issuance
      operationId: uploadDocument
      summary: Tải tài liệu, trả về mã và SHA-256
      x-werwa-function: '2.04'
      x-werwa-callers: Mọi bên có quyền
      x-werwa-roles:
      - ANY
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - file
              - docType
              - title
              properties:
                file:
                  type: string
                  format: binary
                docType:
                  type: string
                title:
                  type: string
                supersedesId:
                  type: string
                  format: uuid
                  description: UUIDv7
                visibility:
                  type: string
                  enum:
                  - INTERNAL
                  - INVESTOR
                  - PUBLIC
              additionalProperties: false
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        4XX:
          description: Lỗi
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        5XX:
          description: Lỗi
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/series:
    post:
      tags:
      - issuance
      operationId: createSeries
      summary: Tạo series từ term sheet
      x-werwa-function: '2.05'
      x-werwa-callers: Holco, tổ hợp
      x-werwa-roles:
      - OPERATOR
      - SYNDICATE
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SeriesCreate'
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Series'
        4XX:
          description: Lỗi
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        5XX:
          description: Lỗi
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/series/{id}:
    get:
      tags:
      - issuance
      operationId: getSeries
      summary: Series, trạng thái, lịch sự kiện
      x-werwa-function: '2.07'
      x-werwa-callers: Mọi bên có quyền
      x-werwa-roles:
      - ANY
      parameters:
      - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Series'
        4XX:
          description: Lỗi
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        5XX:
          description: Lỗi
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/series/{id}/submit:
    post:
      tags:
      - issuance
      operationId: submitSeries
      summary: Gửi duyệt 4 mắt
      x-werwa-function: '2.05'
      x-werwa-callers: Holco · người lập
      x-werwa-roles:
      - OPERATOR
      parameters:
      - $ref: '#/components/parameters/Id'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: Đã tạo yêu cầu duyệt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SigningProposalRef'
        4XX:
          description: Lỗi
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        5XX:
          description: Lỗi
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/series/{id}/deploy:
    post:
      tags:
      - issuance
      operationId: deploySeries
      summary: Tạo đề nghị ký triển khai 3/3
      x-werwa-function: '2.07'
      x-werwa-callers: Holco
      x-werwa-roles:
      - OPERATOR
      parameters:
      - $ref: '#/components/parameters/Id'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: Đã nhận; tạo yêu cầu duyệt hoặc đề nghị ký
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SigningProposalRef'
        4XX:
          description: Lỗi
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        5XX:
          description: Lỗi
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/issuer-decisions:
    post:
      tags:
      - issuance
      operationId: recordIssuerDecision
      summary: Ghi quyết định về điều khoản, lãi suất
      x-werwa-function: '2.06'
      x-werwa-callers: UBND
      x-werwa-roles:
      - ISSUER
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssuerDecisionCreate'
      responses:
        '201':
          description: OK
        4XX:
          description: Lỗi
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        5XX:
          description: Lỗi
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/offerings:
    post:
      tags:
      - distribution
      operationId: createOffering
      summary: Tạo đợt chào bán
      x-werwa-function: '3.01'
      x-werwa-callers: Tổ hợp, UBND
      x-werwa-roles:
      - SYNDICATE
      - ISSUER
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OfferingCreate'
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Offering'
        4XX:
          description: Lỗi
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        5XX:
          description: Lỗi
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/offerings/{id}/open:
    post:
      tags:
      - distribution
      operationId: openOffering
      summary: Mở sổ lệnh
      x-werwa-function: '3.01'
      x-werwa-callers: Tổ hợp
      x-werwa-roles:
      - SYNDICATE
      parameters:
      - $ref: '#/components/parameters/Id'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Offering'
        4XX:
          description: Lỗi
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        5XX:
          description: Lỗi
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/offerings/{id}/close:
    post:
      tags:
      - distribution
      operationId: closeOffering
      summary: Đóng sổ lệnh
      x-werwa-function: '3.01'
      x-werwa-callers: Tổ hợp
      x-werwa-roles:
      - SYNDICATE
      parameters:
      - $ref: '#/components/parameters/Id'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Offering'
        4XX:
          description: Lỗi
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        5XX:
          description: Lỗi
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/offerings/{id}/orders:
    post:
      tags:
      - distribution
      operationId: placeOrder
      summary: Đặt lệnh; kiểm điều kiện ngay khi đặt
      x-werwa-function: '3.02'
      x-werwa-callers: Nhà đầu tư, tổ hợp nhập thay
      x-werwa-roles:
      - INVESTOR
      - SYNDICATE
      parameters:
      - $ref: '#/components/parameters/Id'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderPlace'
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        4XX:
          description: Lỗi
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        5XX:
          description: Lỗi
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/orders/{id}:
    patch:
      tags:
      - distribution
      operationId: amendOrder
      summary: Sửa lệnh trước giờ đóng sổ
      x-werwa-function: '3.02'
      x-werwa-callers: Nhà đầu tư, tổ hợp nhập thay
      x-werwa-roles:
      - INVESTOR
      - SYNDICATE
      parameters:
      - $ref: '#/components/parameters/Id'
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderAmend'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        4XX:
          description: Lỗi
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        5XX:
          description: Lỗi
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    delete:
      tags:
      - distribution
      operationId: cancelOrder
      summary: Hủy lệnh trước giờ đóng sổ
      x-werwa-function: '3.02'
      x-werwa-callers: Nhà đầu tư, tổ hợp nhập thay
      x-werwa-roles:
      - INVESTOR
      - SYNDICATE
      parameters:
      - $ref: '#/components/parameters/Id'
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        4XX:
          description: Lỗi
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        5XX:
          description: Lỗi
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/offerings/{id}/allocation-lists:
    post:
      tags:
