      - basisDocumentId
      - action
      - seriesId
      - walletId
      - quantity
      properties:
        authorityName:
          type: string
        orderNo:
          type: string
        issuedOn:
          type: string
          format: date
        basisDocumentId:
          type: string
          format: uuid
          description: UUIDv7
        action:
          type: string
          enum:
          - FREEZE
          - UNFREEZE
          - FORCED_TRANSFER
        seriesId:
          type: string
          format: uuid
          description: UUIDv7
        walletId:
          type: string
          format: uuid
          description: UUIDv7
        toWalletId:
          type: string
          format: uuid
          description: Chỉ cho FORCED_TRANSFER
        quantity:
          type: integer
          format: int64
          minimum: 0
          description: Số trái phiếu (decimals 0)
      additionalProperties: false
    EnforcementOrder:
      allOf:
      - $ref: '#/components/schemas/EnforcementOrderCreate'
      - type: object
        required:
        - id
        - status
        properties:
          id:
            type: string
            format: uuid
            description: UUIDv7
          basisHash:
            type: string
            pattern: ^0x[0-9a-fA-F]{64}$
          approvalRequestId:
            type: string
            format: uuid
            description: UUIDv7
          status:
            type: string
            enum:
            - RECEIVED
            - PENDING_APPROVAL
            - PENDING_SIGNATURES
            - APPLIED
            - REJECTED
        additionalProperties: false
    AuditEntry:
      type: object
      required:
      - seq
      - occurredAt
      - action
      - subjectRef
      - payloadHash
      - prevHash
      - entryHash
      properties:
        seq:
          type: integer
        occurredAt:
          type: string
          format: date-time
        actorUserId:
          type: string
          format: uuid
          description: UUIDv7
        actorOrgId:
          type: string
          format: uuid
          description: UUIDv7
        action:
          type: string
        subjectRef:
          type: string
        payloadHash:
          type: string
          pattern: ^0x[0-9a-fA-F]{64}$
        prevHash:
          type: string
          pattern: ^0x[0-9a-fA-F]{64}$
        entryHash:
          type: string
          pattern: ^0x[0-9a-fA-F]{64}$
        anchor:
          type: object
          required: []
          properties:
            businessDate:
              type: string
              format: date
            txHash:
              type: string
              pattern: ^0x[0-9a-fA-F]{64}$
