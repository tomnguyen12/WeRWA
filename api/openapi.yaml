components:
  securitySchemes:
    oidc:
      type: openIdConnect
      openIdConnectUrl: https://auth.werwa.local/realms/werwa/.well-known/openid-configuration
    bankMtls:
      type: mutualTLS
      description: 'Webhook BIDV: mTLS và header X-Bank-Signature'
    alertToken:
      type: http
      scheme: bearer
      description: Webhook Alertmanager; token cố định cấu hình ở cả hai phía (Q56), không phải token OIDC
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        maxLength: 128
      description: Bắt buộc cho mọi lệnh ghi; cùng khóa trong 24 giờ trả lại đúng kết quả lần đầu.
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
      description: ETag; sai phiên bản trả 412
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
        description: UUIDv7
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    BankSignature:
      name: X-Bank-Signature
      in: header
      required: true
      schema:
        type: string
      description: Chữ ký thông điệp của BIDV
  schemas:
    Money:
      type: object
      required:
      - amountMinor
      - currency
      properties:
        amountMinor:
          type: string
          pattern: ^[0-9]+$
          description: Số tiền theo đơn vị nhỏ nhất, dạng chuỗi
        currency:
          type: string
          pattern: ^[A-Z]{3}$
      additionalProperties: false
    Problem:
      type: object
      required:
      - type
      - title
      - status
      - code
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
          description: Mã lỗi nghiệp vụ, ví dụ ALLOCATION_EXCEEDS_MAX
    ChainTxRef:
      type: object
      required:
      - chainTxId
      - status
      properties:
        chainTxId:
          type: string
          format: uuid
          description: UUIDv7
        status:
          type: string
          enum:
          - BUILT
          - SENT
          - MINED
          - FAILED
      additionalProperties: false
    SigningProposalRef:
      type: object
      required:
      - status
      properties:
        signingProposalId:
          type: string
          format: uuid
          description: UUIDv7
        approvalRequestId:
          type: string
          format: uuid
          description: UUIDv7
        status:
          type: string
          enum:
          - PENDING_APPROVAL
          - QUEUED
          - COLLECTING
          - THRESHOLD_REACHED
          - SENT
          - MINED
          - FAILED
          - CANCELLED
      additionalProperties: false
      description: 'Trả kèm 202 cho mọi thao tác dẫn tới ký trên chuỗi; kết quả cuối báo qua sự kiện và GET trạng thái. Thao tác còn
        phải qua duyệt 4 mắt trước khi có đề nghị ký thì trả approvalRequestId với status PENDING_APPROVAL, chưa có signingProposalId
        (Q35).'
    Decision:
      type: object
      required:
      - decision
      properties:
        decision:
          type: string
          enum:
          - APPROVE
          - REJECT
        comment:
          type: string
      additionalProperties: false
    Organization:
      type: object
      required:
      - id
      - legalName
      - roles
      - kybStatus
      properties:
        id:
          type: string
          format: uuid
          description: UUIDv7
        legalName:
          type: string
        registrationNo:
          type: string
        country:
          type: string
        roles:
          type: array
          items:
            type: string
            enum:
            - ISSUER
            - OPERATING_AGENCY
            - SYNDICATE
            - REGISTRAR
            - PAYING_AGENT
            - TREASURY
            - CUSTODIAN
            - TRUSTEE
            - SUPERVISOR
            - OPERATOR
            - INVESTOR
        kybStatus:
          type: string
          enum:
          - DRAFT
          - PENDING_REVIEW
          - KYB_APPROVED
          - KYB_REJECTED
        notificationEmail:
          type: string
