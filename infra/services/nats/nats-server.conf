# NATS JetStream cho sự kiện WeRWA (outbox → NATS, docs/design/05-api-va-su-kien.md).
# Mật khẩu lấy từ biến môi trường do services.sh sinh; không ghi trong tệp này.

server_name: werwa-devnet-nats
port: 4222
http_port: 8222

jetstream {
  store_dir: /data
  max_memory_store: 256MB
  max_file_store: 10GB
}

accounts {
  WERWA {
    jetstream: enabled
    users: [
      # Backend: phát và nhận sự kiện werwa.>, dùng JetStream API để ack và tạo consumer.
      {
        user: werwa_app
        password: $NATS_APP_PASSWORD
        permissions: {
          publish: ["werwa.>", "$JS.API.>", "$JS.ACK.>", "_INBOX.>"]
          subscribe: ["werwa.>", "_INBOX.>"]
        }
      }
      # Quản trị devnet: tạo stream, kiểm thử.
      { user: werwa_admin, password: $NATS_ADMIN_PASSWORD }
    ]
  }
}

# Đã khai báo người dùng nên mọi kết nối phải xác thực; không đặt no_auth_user.
