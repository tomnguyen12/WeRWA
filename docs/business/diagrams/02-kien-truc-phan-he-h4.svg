<rect class="lane" height="58" width="944" x="0" y="68"></rect><text class="tln" x="8" y="101.0">1 Onboarding</text>
<rect class="lane" height="58" width="944" x="0" y="126"></rect><text class="tln" x="8" y="159.0">2 Phát hành</text>
<rect class="lane" height="58" width="944" x="0" y="184"></rect><text class="tln" x="8" y="217.0">3 Phân phối</text>
<rect class="lane" height="58" width="944" x="0" y="242"></rect><text class="tln" x="8" y="275.0">4 Quản trị</text>
<rect class="lane" height="58" width="944" x="0" y="300"></rect><text class="tln" x="8" y="333.0">5 Tích hợp</text>
<rect class="lane" height="58" width="944" x="0" y="358"></rect><text class="tln" x="8" y="391.0">6 Onchain</text>
<rect class="sx" height="44" rx="5" width="118" x="118" y="17"></rect>
<text class="sn" x="124" y="30">1</text><text class="st" text-anchor="middle" x="184.0" y="36">Lệnh của cơ quan</text><text class="ss" text-anchor="middle" x="184.0" y="50">có thẩm quyền</text>
<rect class="s" height="44" rx="5" width="118" x="254" y="249"></rect>
<text class="sn" x="260" y="262">2</text><text class="st" text-anchor="middle" x="320.0" y="268">Tiếp nhận lệnh</text><text class="ss" text-anchor="middle" x="320.0" y="282">ghi căn cứ</text>
<rect class="s" height="44" rx="5" width="118" x="390" y="249"></rect>
<text class="sn" x="396" y="262">3</text><text class="st" text-anchor="middle" x="456.0" y="268">Duyệt 4 mắt</text><text class="ss" text-anchor="middle" x="456.0" y="282"></text>
<rect class="sx" height="44" rx="5" width="118" x="526" y="17"></rect>
<text class="sn" x="532" y="30">4</text><text class="st" text-anchor="middle" x="592.0" y="36">VSDC phê duyệt</text><text class="ss" text-anchor="middle" x="592.0" y="50">qua giao diện</text>
<rect class="sa" height="44" rx="5" width="118" x="662" y="365"></rect>
<text class="sn" x="668" y="378">5</text><text class="st" text-anchor="middle" x="728.0" y="384">Chữ ký nhiều bên</text><text class="ss" text-anchor="middle" x="728.0" y="398">thực thi</text>
<path class="e" d="M236,39.0 H245.0 V271.0 H253" marker-end="url(#ah)"></path>
<path class="e" d="M372,271.0 H381.0 V271.0 H389" marker-end="url(#ah)"></path>
<path class="e" d="M508,271.0 H517.0 V39.0 H525" marker-end="url(#ah)"></path>
