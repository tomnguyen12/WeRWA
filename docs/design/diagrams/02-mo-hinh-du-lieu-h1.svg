<rect class="box-x" height="50" rx="6" width="160" x="860" y="150"></rect><text class="t" text-anchor="middle" x="940" y="172">Ví</text><text class="ts" text-anchor="middle" x="940" y="189">onboarding</text>
<rect class="box-a" height="50" rx="6" width="160" x="230" y="270"></rect><text class="t" text-anchor="middle" x="310" y="292">Danh sách chốt</text><text class="ts" text-anchor="middle" x="310" y="309">record_snapshot</text>
