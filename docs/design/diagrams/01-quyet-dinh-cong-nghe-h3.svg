<rect class="lane" height="64" width="1190" x="0" y="276"></rect><text class="tn" x="12" y="312">6 · Onchain</text>
<rect class="lane-x" height="64" width="1190" x="0" y="340"></rect><text class="tn" x="12" y="376">VSDC · bên ngoài</text>
<rect class="box" height="44" rx="6" width="115" x="150" y="158"></rect><text class="t" text-anchor="middle" x="207" y="177">1 · Chốt phân bổ</text><text class="ts" text-anchor="middle" x="207" y="193">tổ hợp đề xuất</text>
<rect class="box-v" height="44" rx="6" width="115" x="280" y="222"></rect><text class="t" text-anchor="middle" x="337" y="241">2 · UBND duyệt</text><text class="ts" text-anchor="middle" x="337" y="257">4 mắt rồi ký</text>
<rect class="box-a" height="44" rx="6" width="115" x="410" y="286"></rect><text class="t" text-anchor="middle" x="467" y="305">3 · Ghi danh sách</text><text class="ts" text-anchor="middle" x="467" y="321">lãi suất, gốc DS</text>
<rect class="box-x" height="44" rx="6" width="115" x="410" y="30"></rect><text class="t" text-anchor="middle" x="467" y="49">4 · Nhận USD</text><text class="ts" text-anchor="middle" x="467" y="65">ngoài nền tảng, ký lô</text>
<rect class="box" height="44" rx="6" width="115" x="540" y="94"></rect><text class="t" text-anchor="middle" x="597" y="113">5 · Xác nhận IPA</text><text class="ts" text-anchor="middle" x="597" y="129">chặn trùng mã TC</text>
<rect class="box" height="44" rx="6" width="115" x="670" y="158"></rect><text class="t" text-anchor="middle" x="727" y="177">6 · Đối chiếu</text><text class="ts" text-anchor="middle" x="727" y="193">đủ tiền theo phân bổ</text>
<rect class="box-w" height="44" rx="6" width="115" x="670" y="222"></rect><text class="t" text-anchor="middle" x="727" y="241">Giữ ở "chờ tiền"</text><text class="ts" text-anchor="middle" x="727" y="257">báo tổ hợp</text>
<rect class="box-a" height="44" rx="6" width="115" x="800" y="286"></rect><text class="t" text-anchor="middle" x="857" y="305">7 · Holco mint</text><text class="ts" text-anchor="middle" x="857" y="321">khóa chuyển nhượng</text>
<rect class="box-x" height="44" rx="6" width="115" x="930" y="350"></rect><text class="t" text-anchor="middle" x="987" y="369">8 · VSDC ký</text><text class="ts" text-anchor="middle" x="987" y="385">xác nhận sổ</text>
<rect class="box-a" height="44" rx="6" width="115" x="1060" y="286"></rect><text class="t" text-anchor="middle" x="1117" y="305">9 · Lưu hành</text><text class="ts" text-anchor="middle" x="1117" y="321">mở chuyển nhượng</text>
<rect class="box-v" height="44" rx="6" width="115" x="1060" y="222"></rect><text class="t" text-anchor="middle" x="1117" y="241">10 · Đối soát</text><text class="ts" text-anchor="middle" x="1117" y="257">chuỗi · BIDV · sổ</text>
