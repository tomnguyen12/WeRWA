<rect class="lane" height="64" width="1190" x="0" y="84"></rect><text class="tn" x="12" y="120">5 · Tích hợp</text>
<rect class="lane" height="64" width="1190" x="0" y="148"></rect><text class="tn" x="12" y="184">3 · Phân phối</text>
