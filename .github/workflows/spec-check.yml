name: spec-check

# Chạy với mọi PR và mọi push vào main, để có thể đặt hai bước dưới làm status check bắt buộc.
# CI chỉ chạy khi Tommy ra lệnh (31/10/2026): GitHub → Actions → chọn workflow → Run workflow, chọn nhánh.
# Bật lại tự động: thay khối on dưới đây bằng khối đã tắt.
#   on:
#     pull_request:
#     push:
#       branches: [main]
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  openapi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npx --yes @redocly/cli@1.25.0 lint api/openapi.yaml
      - name: Mọi API có x-werwa-roles hợp lệ (B1.0)
        run: |
          python3 - <<'PY'
          import yaml, sys
          d = yaml.safe_load(open('api/openapi.yaml'))
          enum = set(d['components']['schemas']['Organization']['properties']['roles']['items']['enum'])
          bad = []
          for path, ops in d['paths'].items():
              for method, op in ops.items():
                  if not isinstance(op, dict) or 'operationId' not in op:
                      continue
                  roles = op.get('x-werwa-roles')
                  if not roles or not isinstance(roles, list):
                      bad.append(f'{method.upper()} {path}: thiếu x-werwa-roles')
                  elif roles != ['ANY'] and not set(roles) <= enum:
                      bad.append(f'{method.upper()} {path}: vai lạ {sorted(set(roles) - enum)}')
          if bad:
              print('\n'.join(bad)); sys.exit(1)
          print('x-werwa-roles hợp lệ')
          PY

  event-schemas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install jsonschema==4.23.0 pyyaml==6.0.2
      - name: Lược đồ hợp lệ và khớp catalog
        run: |
          python - <<'PY'
          import json, glob, yaml, jsonschema, sys
          cat = yaml.safe_load(open('api/events/catalog.yaml'))['events']
          files = {p.split('/')[-1] for p in glob.glob('api/events/werwa.*.schema.json')}
          listed = {e['schema'] for e in cat}
          for f in sorted(glob.glob('api/events/*.schema.json')):
              jsonschema.Draft202012Validator.check_schema(json.load(open(f)))
          if files != listed:
              print('Lệch catalog:', sorted(files ^ listed)); sys.exit(1)
          print(len(files), 'lược đồ hợp lệ')
          PY
