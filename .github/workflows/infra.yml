name: infra

# Cổng của luồng infra/ (CONTRIBUTING.md, mục CI): dựng devnet Besu QBFT và chạy kiểm thử trên mạng thật.
on:
  pull_request:
    paths:
      - 'infra/**'
      - '.github/workflows/infra.yml'
  push:
    branches: [main]
    paths:
      - 'infra/**'
      - '.github/workflows/infra.yml'

permissions:
  contents: read

env:
  FOUNDRY_VERSION: v1.8.5
  BESU_IMAGE: hyperledger/besu:26.10.0

jobs:
  devnet:
    name: devnet · kiểm thử khói
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v5
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: ${{ env.FOUNDRY_VERSION }}
      - name: Kéo ảnh Besu
        run: docker pull "$BESU_IMAGE"
      - name: Dựng devnet
        run: devnet/devnet.sh up
      - name: Kiểm thử khói (khối 2 giây, 4 validator, phí gas 0, cấp phép)
        run: test/devnet-smoke.sh
      - name: US-6.01 (tắt 1 validator, mất vùng A, tắt 2 validator rồi bật lại)
        run: test/us-6.01.sh
      - name: Nhật ký node khi lỗi
        if: failure()
        run: docker compose -p werwa-devnet logs --no-color --tail 300
      - name: Dừng devnet
        if: always()
        run: devnet/devnet.sh clean
