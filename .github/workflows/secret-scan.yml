name: secret-scan

# Cổng "Mọi PR · Quét bí mật" (CONTRIBUTING.md, mục CI): không có khóa, mật khẩu, token trong diff.
# CI chỉ chạy khi Tommy ra lệnh (31/10/2026): GitHub → Actions → chọn workflow → Run workflow, chọn nhánh.
# Bật lại tự động: thay khối on dưới đây bằng khối đã tắt.
#   on:
#     pull_request:
#     push:
#       branches: [main]
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  GITLEAKS_VERSION: 8.28.0
  GITLEAKS_SHA256: a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb

jobs:
  gitleaks:
    name: Quét bí mật
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Cài gitleaks (ghim phiên bản và mã băm)
        run: |
          curl -sSfL -o gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
      - name: Quét commit của PR
        if: github.event_name == 'pull_request'
        run: ./gitleaks git . --redact --no-banner --log-opts="origin/${{ github.base_ref }}..HEAD"
      - name: Quét toàn bộ lịch sử
        if: github.event_name == 'push'
        run: ./gitleaks git . --redact --no-banner
