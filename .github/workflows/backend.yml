name: backend

# Cổng bắt buộc của luồng backend/ (CONTRIBUTING.md, mục CI).
# Chạy với mọi PR và push vào main để đặt làm status check bắt buộc; chạy cả khi push nhánh backend,
# vì phiên Claude backend build và kiểm thử trên CI trước khi mở PR (Q3).
# CI chỉ chạy khi Tommy ra lệnh (31/10/2026): GitHub → Actions → chọn workflow → Run workflow, chọn nhánh.
# Bật lại tự động: thay khối on dưới đây bằng khối đã tắt.
#   on:
#     pull_request:
#     push:
#       branches:
#         - main
#         - 'feat/backend/**'
#         - 'fix/backend/**'
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

jobs:
  build-test:
    name: build · unit · Modulith · tích hợp
    # Runner: biến kho WERWA_BACKEND_RUNNER (JSON), ví dụ ["self-hosted","linux","werwa-ci"] cho runner tự host
    # (infra/ci/README.md); không đặt thì dùng máy GitHub.
    runs-on: ${{ fromJSON(vars.WERWA_BACKEND_RUNNER || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Foundry (kiểm thử chuỗi chạy DeployPlatform, D9)
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.5
      - name: Công cụ cho infra/safe/safe.sh (kiểm thử ký multisig dựng Safe 1.4.1 thật, Q113)
        run: cast --version && jq --version && curl --version | head -1 && openssl version
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: |
            backend/pom.xml
            backend/bidv-simulator/pom.xml
      - name: Build, kiểm thử đơn vị, ApplicationModules.verify(), kiểm thử tích hợp (Testcontainers)
        run: |
          ci/run.sh
          echo "::notice title=tests::$(grep -E 'Tests run:.*Fail' build.log | grep -v ' in ' | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
      - name: Tóm tắt lỗi thành annotation (đọc được qua API)
        if: failure()
        run: |
          summary() { sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}' | cut -c1-60000; }
          echo "::error title=build-errors::$(grep -E '\[ERROR\]|FAILED|Caused by|Exception' build.log | grep -v '^\s*at ' | head -80 | summary)"
          first=$(grep -n -m1 '\[ERROR\]' build.log | cut -d: -f1)
          [ -n "$first" ] && echo "::error title=context-before-first-error::$(sed -n "$((first>60?first-60:1)),$((first+5))p" build.log | summary)"
          echo "::error title=bind::$(grep -h -A8 -E 'Failed to bind|Reason:|Property:' build.log target/failsafe-reports/*.txt 2>/dev/null | head -40 | summary)"
          for f in target/surefire-reports/*.txt target/failsafe-reports/*.txt bidv-simulator/target/surefire-reports/*.txt; do
            [ -f "$f" ] && grep -q -E 'FAILURE|ERROR' "$f" && echo "::error title=$(basename "$f")::$(head -60 "$f" | summary)"
          done
          true
      - name: Tài liệu mô-đun
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: modulith-docs
          path: backend/target/spring-modulith-docs
          if-no-files-found: ignore
