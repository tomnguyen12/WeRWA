name: backend

# Cổng bắt buộc của luồng backend/ (CONTRIBUTING.md, mục CI).
# Chạy với mọi PR và push vào main để đặt làm status check bắt buộc; chạy cả khi push nhánh backend,
# vì phiên Claude backend build và kiểm thử trên CI trước khi mở PR (Q3).
on:
  pull_request:
  push:
    branches:
      - main
      - 'feat/backend/**'
      - 'fix/backend/**'

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

jobs:
  build-test:
    name: build · unit · Modulith · tích hợp
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Phiên bản thư viện mới nhất (tạm, để ghim pom)
        run: |
          out=""
          for a in org/springframework/boot/spring-boot-starter-parent org/springframework/modulith/spring-modulith-bom; do
            v=$(curl -sS "https://repo1.maven.org/maven2/$a/maven-metadata.xml" | grep -o '<version>[^<]*' | sed 's/<version>//' | tail -12 | tr '\n' ' ')
            out="$out$a: $v%0A"
          done
          echo "::notice title=versions::$out"
      - name: Build, kiểm thử đơn vị, ApplicationModules.verify(), kiểm thử tích hợp (Testcontainers)
        run: |
          set -o pipefail
          mvn -B -ntp verify 2>&1 | tee build.log
      - name: Tóm tắt lỗi thành annotation (đọc được qua API)
        if: failure()
        run: |
          summary() { sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}' | cut -c1-60000; }
          echo "::error title=build-errors::$(grep -E '\[ERROR\]|FAILED|Caused by|Exception' build.log | grep -v '^\s*at ' | head -80 | summary)"
          for f in target/surefire-reports/*.txt target/failsafe-reports/*.txt; do
            [ -f "$f" ] && grep -q -E 'FAILURE|ERROR' "$f" && echo "::error title=$(basename "$f")::$(head -60 "$f" | summary)"
          done
          true
      - name: Tài liệu mô-đun
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: modulith-docs
          path: backend/target/spring-modulith-docs
          if-no-files-found: ignore
