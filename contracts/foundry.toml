# Cấu hình Foundry cho hợp đồng WeRWA.
# Trình biên dịch và optimizer ghim theo T-REX 4.1.3 (docs/design/04-hop-dong-thong-minh.md, mục Yêu cầu bảo mật)
# để bytecode kiểm lại được. Không đổi các giá trị dưới đây nếu không có đề xuất trong docs/decisions/.

[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
ignored_warnings_from = ["lib"]
cache_path = "cache"

solc_version = "0.8.17"
auto_detect_solc = false
evm_version = "london"
optimizer = true
optimizer_runs = 200
via_ir = false
bytecode_hash = "ipfs"
cbor_metadata = true

# Bố cục lưu trữ cần cho kiểm tra nâng cấp; ABI cần cho api/abi/.
extra_output = ["storageLayout", "abi"]

fs_permissions = [{ access = "read", path = "./" }]

[fuzz]
runs = 256
seed = "0x5765525741"

[invariant]
runs = 256
depth = 64
fail_on_revert = false

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"
quote_style = "double"
number_underscore = "thousands"
ignore = ["lib/**"]

# CI: nhiều lượt fuzz hơn.
[profile.ci.fuzz]
runs = 1024

[profile.ci.invariant]
runs = 512
depth = 128
